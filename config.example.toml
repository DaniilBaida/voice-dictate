# Voice Dictate configuration
# Copy to ~/.config/voice-dictate/config.toml

# Local NeMo-Speech.cpp server
server_url = "http://127.0.0.1:8080/v1"

# The server runs NVIDIA Parakeet TDT and exposes it as the default model
model = "default"

# Language code (ISO 639-1). Empty = auto-detect.
language = ""

# Punctuation and capitalisation added by the ASR model itself
automatic_punctuation = false

# Raw mode: paste the transcript exactly as recognised
hotkey = "Ctrl+Space"

# Prompt mode: restructure the transcript before pasting
prompt_hotkey = "Ctrl+Alt+Space"

# Model that does the restructuring. Reads ANTHROPIC_API_KEY from the environment.
cleanup_model = "claude-haiku-4-5"

# Longer dictations paste raw instead, because a rewrite that long starts
# dropping sentences
cleanup_max_words = 600

# Paste shortcut. Supported values: Ctrl+V, Ctrl+Shift+V
paste_shortcut = "Ctrl+V"

# Microphone sample rate. 0 = use device native rate (recommended)
samplerate = 0

# How many days to keep transcription history
history_retention_days = 7
