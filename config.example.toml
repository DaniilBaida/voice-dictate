# Voice Dictate configuration
# Copy to ~/.config/voice-dictate/config.toml

# Local NeMo-Speech.cpp server
server_url = "http://127.0.0.1:8080/v1"

# The server runs NVIDIA Parakeet TDT and exposes it as the default model
model = "default"

# Language code (ISO 639-1). Empty = auto-detect.
language = ""

# Vocabulary hint to bias transcription (e.g. "Python, Rust, TypeScript")
prompt = ""

# Global hotkey. Modifiers: CmdOrCtrl, Ctrl, Shift, Alt, Super
hotkey = "Ctrl+Space"

# Paste shortcut. Supported values: Ctrl+V, Ctrl+Shift+V
paste_shortcut = "Ctrl+V"

# Microphone sample rate. 0 = use device native rate (recommended)
samplerate = 0

# How many days to keep transcription history
history_retention_days = 7
